services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        # Формат "адрес:порт_на_компьютере:порт_в_контейнере". Адрес 127.0.0.1 открывает БД только для программ
        # на вашем компьютере (pgAdmin, psql, локальные тесты), но не для других устройств в сети.
        # Контейнеры внутри compose обращаются к БД по имени сервиса "db" и порту 5432, публикация для них не нужна
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 30s
            timeout: 10s
            retries: 5
        restart: unless-stopped
    redis:
        image: redis:7-alpine
        # Публикация нужна только для отладки (redis-cli с компьютера). Приложение, worker и beat подключаются
        # по имени сервиса "redis" внутри сети compose
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    celery_worker:
        build: .
        volumes:
            - .:/app
        command: celery -A config worker --loglevel=${CELERY_LOG_LEVEL:-INFO}
        # Все настройки (БД, часовой пояс, лимиты Celery) читаются из .env так же, как у сервиса web.
        # Адреса Redis не указываются, в settings.py используются значения по умолчанию для сети compose
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    celery_beat:
        build: .
        volumes:
            - .:/app
        command: celery -A config beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    web:
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            bash -c "
                python manage.py collectstatic --noinput &&
                python manage.py migrate &&
                python manage.py set_super_user &&
                python manage.py runserver 0.0.0.0:8000"
volumes:
    postgres_data:
