name: Easy Mnagement CI

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Check Out Code
              uses: actions/checkout@v3

            - name: Set Up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.13'

            - name: Install Dependencies
              run: pip install flake8

            - name: Run Flake8
              run: flake8 .

    test:
        needs: lint
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:latest
                ports:
                  - 6379:6379
                options: >-
                  --health-cmd "redis-cli ping"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
            db:
                image: postgres:16
                env:
                    POSTGRES_DB: test_db
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                  - 5432:5432
                options: >-
                  --health-cmd "pg_isready -U test_user"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
        steps:
          - name: Check Out Code
            uses: actions/checkout@v3

          - name: Install Poetry
            run: pip install poetry

          - name: Set Up Python
            uses: actions/setup-python@v4
            with:
                python-version: '3.13'
                cache: 'poetry'

          - name: Install Dependencies
            run: poetry install --no-root

          - name: Create .env For Tests
            run: |
              echo "SECRET_KEY=django-secret_test_key" >> .env
              echo "DB_NAME=test_db" >> .env
              echo "DB_USER=test_user" >> .env
              echo "DB_PASSWORD=test_password" >> .env
              echo "CORS_ALLOWED_ORIGINS=http://localhost,https://localhost" >> .env
              echo "CSRF_TRUSTED_ORIGINS=http://localhost,https://localhost" >> .env

          - name: Run Migrations
            run: poetry run python manage.py migrate

          - name: Run Tests
            run: poetry run python manage.py test

