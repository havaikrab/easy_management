name: Easy Mnagement CI

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Check Out Code
              uses: actions/checkout@v3

            - name: Set Up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.13'

            - name: Install Dependencies
              run: pip install flake8

            - name: Run Flake8
              run: flake8 .

