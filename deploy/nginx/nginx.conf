events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Не показывать версию nginx в заголовках ответов и страницах ошибок
    server_tokens off;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Максимальный размер тела запроса (по умолчанию в nginx только 1 МБ)
        client_max_body_size 10m;

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
        }

        location / {
            proxy_pass http://django;

            # Без этих заголовков Django видел бы запросы от nginx: Host был бы "django" (имя upstream),
            # а адрес клиента - адресом контейнера nginx
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
