services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        # Порты не публикуются: БД доступна только контейнерам внутри сети compose
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 30s
            timeout: 10s
            retries: 5
        restart: unless-stopped
    redis:
        image: redis:7-alpine
        # Порты не публикуются: Redis доступен только контейнерам внутри сети compose
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    celery_worker:
        image: ${IMAGE_NAME}
        command: celery -A config worker --loglevel=${CELERY_LOG_LEVEL:-INFO}
        # Все настройки читаются из .env так же, как у сервиса web. Образ собирается без .env, поэтому без
        # env_file worker и beat получали бы значения по умолчанию (UTC, интервал 30 минут и т.д.)
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    celery_beat:
        image: ${IMAGE_NAME}
        command: celery -A config beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    web:
        image: ${IMAGE_NAME}
        env_file:
            - .env
        volumes:
            - static_volume:/app/staticfiles
        # expose открывает порт только для контейнеров внутри сети compose (nginx). Снаружи приложение доступно
        # только через nginx на порту 80, прямой доступ к gunicorn в обход nginx закрыт
        expose:
            - "8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            bash -c "
                python manage.py collectstatic --noinput &&
                python manage.py migrate &&
                python manage.py set_super_user &&
                gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        restart: unless-stopped
    nginx:
        build:
            context: ./nginx
        # Единственный сервис, доступный снаружи: порт 80 сервера направляется на порт 80 контейнера
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - static_volume:/app/staticfiles:ro
        depends_on:
            - web
        restart: unless-stopped
volumes:
    postgres_data:
    static_volume:
